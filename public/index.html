<!DOCTYPE html>
<html>
<head>
    <title>LIBER</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        input {
            background: #111;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            text-align: center;
            width: 300px;
            outline: none;
        }
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
        }
        button:hover {
            background: #333;
            color: #fff;
        }
        .error {
            color: #ff0000;
            margin-top: 15px;
            display: none;
        }
        .hidden {
            display: none;
        }
        .result {
            margin-top: 20px;
        }
        .code a {
            color: #0f0;
            text-decoration: none;
            border: 1px solid #0f0;
            padding: 10px 20px;
            display: inline-block;
            margin-top: 10px;
        }
        .code a:hover {
            background: #0f0;
            color: #000;
        }
        .x1 { display: none; }
        .x2 { display: none; }
        .x3 { display: none; }
        .data-part { display: none; }
        .part-a { display: none; }
        .part-b { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-weight: 300; letter-spacing: 10px;">LIBER</h1>
        <p style="color: #888; margin-bottom: 30px;">ENTER PASSWORD</p>
        <input type="text" id="password" placeholder="PASSWORD" autofocus>
        <br>
        <button onclick="checkPassword()">VERIFY</button>
        <div id="error" class="error">INVALID PASSWORD</div>
        <div id="result" class="result hidden">
            <p style="color: #0f0;">ACCESS GRANTED</p>
            <div class="code">
                <a id="videoLink" target="_blank">▶ WATCH VIDEO</a>
            </div>
        </div>
    </div>

    <div class="x1" data-q="b"></div>
    <div class="x2" data-r="e"></div>
    <span class="data-part" style="display:none;">Y</span>
    <div class="part-a" style="display:none;">i</div>
    <div class="part-b" style="display:none;">P</div>
    <div id="m1" style="display:none;">u</div>
    <div id="m2" style="display:none;">A</div>
    <div class="x3" data-s="U"></div>
    <div class="x1" data-t="3"></div>
    <span id="z3" style="display:none;">O</span>
    <div id="m3" style="display:none;">w</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        function getPart1() {
            var a = document.querySelector('.x1[data-q]').getAttribute('data-q');
            var b = document.querySelector('.x2[data-r]').getAttribute('data-r');
            var c = document.querySelector('.data-part').textContent;
            var d = document.querySelector('.part-a').textContent;
            var e = document.querySelector('.part-b').textContent;
            var f = document.getElementById('m1').textContent;
            var g = document.getElementById('m2').textContent;
            var h = document.querySelector('.x3[data-s]').getAttribute('data-s');
            var i = document.querySelector('.x1[data-t]').getAttribute('data-t');
            var j = document.getElementById('z3').textContent;
            var k = document.getElementById('m3').textContent;
            return a + b + c + d + e + f + g + h + i + j + k;
        }

        function buildLink() {
            var p1 = 'htt' + 'ps' + '://';
            var p2 = 'y' + 'ou' + 't' + 'u';
            var p3 = '.be' + '/';
            var p4 = getPart1();
            return p1 + p2 + p3 + p4;
        }

        function checkPassword() {
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            fetch('/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    result.classList.remove('hidden');
                    error.style.display = 'none';
                    document.getElementById('videoLink').href = buildLink();
                } else {
                    error.style.display = 'block';
                    document.getElementById('password').value = '';
                    result.classList.add('hidden');
                }
            });
        }

        document.getElementById('password').focus();
    </script>
</body>
</html>
