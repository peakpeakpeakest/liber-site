<!DOCTYPE html>
<html>
<head>
    <title>LIBER</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        input {
            background: #111;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            text-align: center;
            width: 300px;
            outline: none;
        }
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
        }
        button:hover {
            background: #333;
            color: #fff;
        }
        .error {
            color: #ff0000;
            margin-top: 15px;
            display: none;
        }
        .hidden {
            display: none;
        }
        .result {
            margin-top: 20px;
        }
        .code a {
            color: #0f0;
            text-decoration: none;
            border: 1px solid #0f0;
            padding: 10px 20px;
            display: inline-block;
            margin-top: 10px;
        }
        .code a:hover {
            background: #0f0;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-weight: 300; letter-spacing: 10px;">LIBER</h1>
        <p style="color: #888; margin-bottom: 30px;">ENTER PASSWORD</p>
        <input type="text" id="password" placeholder="PASSWORD" autofocus>
        <br>
        <button onclick="checkPassword()">VERIFY</button>
        <div id="error" class="error">INVALID PASSWORD</div>
        <div id="result" class="result hidden">
            <p style="color: #0f0;">ACCESS GRANTED</p>
            <div class="code">
                <a href="https://youtu.be/dQw4w9WgXcQ" target="_blank">▶ WATCH VIDEO</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        function checkPassword() {
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            fetch('/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    result.classList.remove('hidden');
                    error.style.display = 'none';
                } else {
                    error.style.display = 'block';
                    document.getElementById('password').value = '';
                    result.classList.add('hidden');
                }
            });
        }

        document.getElementById('password').focus();
    </script>
</body>
</html>
